name: Build and deploy production

on:
  push:
    branches:
      - main

  # Permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Evita que se ejecuten dos despliegues de producción al mismo tiempo.
concurrency:
  group: projectxyz-production
  cancel-in-progress: true

env:
  # Debe estar completamente en minúsculas.
  IMAGE_NAME: ghcr.io/luisuarez09/projectxyz

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar conexión SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${{ secrets.VPS_PORT }}" \
            -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Actualizar aplicación en el VPS
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            '
              set -e

              cd /srv/projectxyz

              docker compose pull app
              docker compose up -d --no-deps app

              docker compose ps
              docker image prune -f
            '
