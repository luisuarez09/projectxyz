name: Publish production images

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: web
            image: projectxyz-web

          - target: worker
            image: projectxyz-worker

          - target: migrate
            image: projectxyz-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate public application URL
        shell: bash
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_APP_URL }}" ]; then
            echo "NEXT_PUBLIC_APP_URL repository variable is missing."
            exit 1
          fi

          case "${{ vars.NEXT_PUBLIC_APP_URL }}" in
            http://*|https://*)
              echo "NEXT_PUBLIC_APP_URL is configured."
              ;;
            *)
              echo "NEXT_PUBLIC_APP_URL must begin with http:// or https://"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.production
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          push: true

          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

          tags: |
            ghcr.io/luisuarez09/${{ matrix.image }}:main
            ghcr.io/luisuarez09/${{ matrix.image }}:sha-${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
