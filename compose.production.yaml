name: projectxyz

services:
  postgres:
    image: postgres:18.2-bookworm
    restart: unless-stopped
    shm_size: 128mb

    env_file:
      - /srv/projectxyz/.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_DATABASE_USER: ${APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}

      WORKER_DATABASE_USER: ${WORKER_DATABASE_USER}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
      - /srv/projectxyz/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  seaweedfs:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    restart: unless-stopped

    command:
      - mini
      - -dir=/data

    env_file:
      - /srv/projectxyz/.env

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}

    volumes:
      - seaweedfs_data:/data

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:9333/cluster/status
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s


  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    restart: unless-stopped

    volumes:
      - clamav_signatures:/var/lib/clamav

    healthcheck:
      test:
        - CMD
        - clamdscan
        - --ping=1
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s


  migrate:
    image: ghcr.io/luisuarez09/projectxyz-migrate:${IMAGE_TAG:-main}
    restart: "no"

    env_file:
      - /srv/projectxyz/.env

    environment:
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      DATABASE_URL: ${DIRECT_DATABASE_URL}

    command:
      - npm
      - run
      - db:deploy

    depends_on:
      postgres:
        condition: service_healthy


  web:
    image: ghcr.io/luisuarez09/projectxyz-web:${IMAGE_TAG:-main}
    restart: unless-stopped

    env_file:
      - /srv/projectxyz/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://seaweedfs:8333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

    ports:
      - 127.0.0.1:3000:3000

    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s


  worker:
    image: ghcr.io/luisuarez09/projectxyz-worker:${IMAGE_TAG:-main}
    restart: unless-stopped

    env_file:
      - /srv/projectxyz/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: ${WORKER_DATABASE_URL}
      S3_ENDPOINT: http://seaweedfs:8333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      NODE_EXTRA_CA_CERTS: /app/certs/sectigo-public-server-authentication-ca-dv-r36.pem

    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('net');const s=net.connect(5432,'postgres',()=>s.end());s.on('error',()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


volumes:
  postgres_data:
  seaweedfs_data:
  clamav_signatures:
