name: proyectoxyz

services:
  postgres:
    image: postgres:18.2-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proyectoxyz}
      POSTGRES_USER: ${POSTGRES_USER:-proyectoxyz_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_migrator_password}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-proyectoxyz_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-local_app_password}
      WORKER_DATABASE_USER: ${WORKER_DATABASE_USER:-proyectoxyz_worker}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:-local_worker_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: development
    environment:
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-proyectoxyz_migrator}:${POSTGRES_PASSWORD:-local_migrator_password}@postgres:5432/${POSTGRES_DB:-proyectoxyz}
      DATABASE_URL: postgresql://${POSTGRES_USER:-proyectoxyz_migrator}:${POSTGRES_PASSWORD:-local_migrator_password}@postgres:5432/${POSTGRES_DB:-proyectoxyz}
    command: ["npm", "run", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local_s3_access_key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local_s3_secret_key}
      S3_BUCKET: ${S3_BUCKET:-proyectoxyz-private}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DATABASE_USER:-proyectoxyz_app}:${APP_DATABASE_PASSWORD:-local_app_password}@postgres:5432/${POSTGRES_DB:-proyectoxyz}
      S3_ENDPOINT: http://seaweedfs:8333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-me-0001}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY:-v1}
      CREDENTIAL_ENCRYPTION_KEY_V1: ${CREDENTIAL_ENCRYPTION_KEY_V1:-}
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: ["sh", "-c", "npm run db:generate && npm run dev -- -H 0.0.0.0"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${WORKER_DATABASE_USER:-proyectoxyz_worker}:${WORKER_DATABASE_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-proyectoxyz}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY:-v1}
      CREDENTIAL_ENCRYPTION_KEY_V1: ${CREDENTIAL_ENCRYPTION_KEY_V1:-}
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    command: ["sh", "-c", "npm run db:generate && npm run worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(5432,'postgres',()=>s.end());s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  seaweedfs_data:
  clamav_signatures:
  web_node_modules:
  web_next:
  worker_node_modules:
